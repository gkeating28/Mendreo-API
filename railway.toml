# Mendreo hybrid worker — one service runs Gunicorn + Celery worker + beat.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "bash -lc 'cd backend && python manage.py migrate --noinput'"
startCommand = "bash ./start.sh"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
