name: CI

on:
  push:

permissions: write-all

jobs:
  env-selector:
    runs-on: ubuntu-latest
    steps:
      - id: env-condition
        run: |
          echo "environment=dev" >> $GITHUB_OUTPUT
          echo "app_name=mendreo" >> $GITHUB_OUTPUT
          echo "Environment and app name set globally for all branches and events"


    # Map a step output to a job output
    outputs:
      env: ${{ steps.env-condition.outputs.environment }}
      app: ${{ steps.env-condition.outputs.app_name }}

  build:
    runs-on: ubuntu-latest
    needs:
      - env-selector
    environment:
      name: ${{ needs.env-selector.outputs.env }}
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.13.2]

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: mendreo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      # Built-in pip cache (speeds up downloads)
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install GDAL (system deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal

      # Cache the virtualenv (skips installs if requirements.txt hash unchanged)
      - name: Cache venv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: venv
          key: ${{ runner.os }}-py${{ matrix.python-version }}-venv-${{ hashFiles('requirements.txt') }}

      - name: Install Dependencies (uses cache if restored)
        run: |
          if [ ! -d "venv" ]; then
            python -m venv venv
          fi
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov coverage
          pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Set Environment Variables
        run: |
          echo "GENERAL_SECRET_KEY=${{ secrets.GENERAL_SECRET_KEY }}" >> $GITHUB_ENV
          echo "GENERAL_DEBUG=${{ secrets.GENERAL_DEBUG }}" >> $GITHUB_ENV
          echo "GENERAL_HOST_DOMAIN=${{ secrets.GENERAL_HOST_DOMAIN }}" >> $GITHUB_ENV
          echo "GENERAL_HOST_IP=${{ secrets.GENERAL_HOST_IP }}" >> $GITHUB_ENV
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> $GITHUB_ENV
          echo "DATABASE_ENGINE=${{ secrets.DATABASE_ENGINE }}" >> $GITHUB_ENV
          echo "DATABASE_USER=${{ secrets.DATABASE_USER }}" >> $GITHUB_ENV
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> $GITHUB_ENV
          echo "DATABASE_HOST=${{ secrets.DATABASE_HOST }}" >> $GITHUB_ENV
          echo "DATABASE_PORT=${{ secrets.DATABASE_PORT }}" >> $GITHUB_ENV
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}" >> $GITHUB_ENV
          echo "AWS_CLOUD_FRONT_DOMAIN=${{ secrets.AWS_CLOUD_FRONT_DOMAIN }}" >> $GITHUB_ENV
          echo "AWS_CLOUD_FRONT_RESIZER_DOMAIN=${{ secrets.AWS_CLOUD_FRONT_RESIZER_DOMAIN }}" >> $GITHUB_ENV
          echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> $GITHUB_ENV
          echo "SENDGRID_API_ID=${{ secrets.SENDGRID_API_ID }}" >> $GITHUB_ENV
          echo "SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" >> $GITHUB_ENV
          echo "BROKER_URL=${{ secrets.BROKER_URL }}" >> $GITHUB_ENV
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> $GITHUB_ENV
          echo "FACEBOOK_CLIENT_ID=${{ secrets.FACEBOOK_CLIENT_ID }}" >> $GITHUB_ENV
          echo "FACEBOOK_CLIENT_SECRET_KEY=${{ secrets.FACEBOOK_CLIENT_SECRET_KEY }}" >> $GITHUB_ENV
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> $GITHUB_ENV
          echo "GOOGLE_OAUTH2_KEY=${{ secrets.GOOGLE_OAUTH2_KEY }}" >> $GITHUB_ENV
          echo "GOOGLE_OAUTH2_SECRET=${{ secrets.GOOGLE_OAUTH2_SECRET }}" >> $GITHUB_ENV
          echo "SURVEY_CODE=${{ secrets.SURVEY_CODE }}" >> $GITHUB_ENV
          echo "SURVEY_WEB_APP_URL=${{ secrets.SURVEY_WEB_APP_URL }}" >> $GITHUB_ENV
          echo "SURVEY_MOBILE_APP_URL=${{ secrets.SURVEY_MOBILE_APP_URL }}" >> $GITHUB_ENV
          echo "BUNDLE_ID_ANDROID=${{ secrets.BUNDLE_ID_ANDROID }}" >> $GITHUB_ENV
          echo "BUNDLE_ID_IOS=${{ secrets.BUNDLE_ID_IOS }}" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV
          echo "APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "APPLE_SERVICES_ID=${{ secrets.APPLE_SERVICES_ID }}" >> $GITHUB_ENV
          echo "APPLE_IN_APP_SHARED_SECRET=${{ secrets.APPLE_IN_APP_SHARED_SECRET }}" >> $GITHUB_ENV
          echo "APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}" >> $GITHUB_ENV
          echo "APPLE_REDIRECT_URI=${{ secrets.APPLE_REDIRECT_URI }}" >> $GITHUB_ENV
          echo "APPLE_KEY_SECRET<<EOF" >> $GITHUB_ENV
          echo "${{ secrets.APPLE_KEY_SECRET }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Print Dynamic Multiline Variable
        run: echo "$APPLE_KEY_SECRET"
      - name: Run Migrations
        run: |
          source venv/bin/activate
          cd backend
          python manage.py migrate

      - name: Run Tests and Generate Report
        run: |
          source venv/bin/activate
          cd backend
          coverage run --source='.' manage.py test api.tests --testrunner=xmlrunner.extra.djangotestrunner.XMLTestRunner
          coverage combine
          coverage xml

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            backend/test-results.xml
